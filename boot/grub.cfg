# GRUB menu for the x86_64 jk_os ISO (BIOS and UEFI).
# @OS_NAME@ / @OS_VERSION@ are filled in by scripts/build-iso.sh.

set timeout=5
set default=0

# Mirror the menu on the first serial port too (for headless machines / QEMU).
if serial --unit=0 --speed=115200; then
    terminal_input  --append serial
    terminal_output --append serial
fi

# The last console= becomes /dev/console; kernel messages go to all of them.
# jk.live: this kernel came from the installer medium (see initramfs/init).
menuentry "@OS_NAME@ @OS_VERSION@" {
    linux /boot/vmlinuz console=ttyS0,115200 console=tty0 jk.live
}

menuentry "@OS_NAME@ @OS_VERSION@ (serial console)" {
    linux /boot/vmlinuz console=tty0 console=ttyS0,115200 jk.live
}
