# The tablet (Galaxy Tab S7 FE): closing the Book Cover reports a lid
# switch, but suspend isn't brought up on this hardware yet (it may not come
# back), so the cover and idle time don't suspend.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
IdleAction=ignore
# The power button locks the screen (Plasma's lock screen in the desktop;
# nothing happens on a text console) instead of switching off; held down, it
# switches off as usual.
HandlePowerKey=lock
HandlePowerKeyLongPress=poweroff
