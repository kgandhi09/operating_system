# ============================================================
# Keys
# ============================================================

[keys]

prefix = "backtick"


# ------------------------------------------------------------
# Pane navigation
# ------------------------------------------------------------

focus_pane_left  = "shift+left"
focus_pane_right = "shift+right"
focus_pane_up    = "shift+up"
focus_pane_down  = "shift+down"


# ------------------------------------------------------------
# Pane splitting
# ------------------------------------------------------------

split_horizontal = "prefix+h"
split_vertical   = "prefix+v"


# ------------------------------------------------------------
# Tabs
# ------------------------------------------------------------

new_tab      = "alt+n"
previous_tab = "alt+left"
next_tab     = "alt+right"


# ------------------------------------------------------------
# Workspaces
# ------------------------------------------------------------

previous_workspace = "alt+up"
next_workspace     = "alt+down"


# ============================================================
# Fine Pane Resizing
# ============================================================

[[keys.command]]
key = "ctrl+shift+left"
type = "shell"
command = "herdr pane resize --direction left --amount 0.02 --current"
description = "resize pane left"

[[keys.command]]
key = "ctrl+shift+right"
type = "shell"
command = "herdr pane resize --direction right --amount 0.02 --current"
description = "resize pane right"

[[keys.command]]
key = "ctrl+shift+up"
type = "shell"
command = "herdr pane resize --direction up --amount 0.02 --current"
description = "resize pane up"

[[keys.command]]
key = "ctrl+shift+down"
type = "shell"
command = "herdr pane resize --direction down --amount 0.02 --current"
description = "resize pane down"

[[keys.command]]
key = "prefix+shift+r"
type = "plugin_action"
command = "herdr-agent-quota.refresh"
description = "refresh all agent quotas"

[[keys.command]]
key = "prefix+shift+q"
type = "plugin_action"
command = "herdr-agent-quota.open-settings"
description = "open agent quota settings"



[experimental]
kitty_graphics = true
