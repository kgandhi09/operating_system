onboarding = false


# ============================================================
# Theme
# ============================================================

[theme]
name = "dracula"
auto_switch = false


[theme.custom]

# Main foreground
text = "#f8f8f2"

# Secondary text
subtext0 = "#eeeeee"
overlay0 = "#b8b8c8"
overlay1 = "#dddddd"

# Dracula purple highlight
accent = "#bd93f9"
# Bright sidebar / active-border accent
# accent = "#ff79c6"

# Slightly darker sidebar than the main terminal
sidebar_bg = "#000000"

# Keep terminal panes using their normal background
panel_bg = "reset"

# Active workspace / agent
active_row_bg = "#343746"

# Row selected while navigating sidebar
selection_bg = "#44475a"

# Additional UI surfaces
surface0 = "#282a36"
surface1 = "#44475a"

# Bright Dracula colors
red    = "#ff5555"
green  = "#50fa7b"
yellow = "#f1fa8c"
blue   = "#8be9fd"
peach  = "#ffb86c"


# ============================================================
# UI
# ============================================================

[ui]

# Give workspace names some breathing room
sidebar_width = 30
sidebar_min_width = 24
sidebar_max_width = 38

# Clean pane appearance
pane_borders = "auto"
pane_outer_borders = true
pane_gaps = true

# I prefer no scrollbar column in coding terminals
pane_scrollbars = false

# Useful when Codex / Claude etc. are running
show_agent_labels_on_pane_borders = true

# Keep tab bar visible
hide_tab_bar_when_single_tab = false
tab_bar_position = "bottom"

# Make agent states visually distinct
status_indicators = "symbols"

# Keep agents grouped by workspace
agent_panel_sort = "spaces"

# Better outer terminal title
window_title = "Herdr · {workspace} · {tab}"

tab_bar_right = [
    { type = "zoom" },
    { type = "datetime", format = "%H:%M" },
]

tab_bar_right_separator = "    "
# ============================================================
# Workspace / Space Sidebar
# ============================================================

[ui.sidebar.spaces]

# One blank line between unrelated workspaces
row_gap = 0

rows = [
    [
        "state_icon",
        { token = "workspace", fg = "#bd93f9", bold = true }
    ],
    [
        { token = "branch", fg = "#8be9fd", dim = false },
        "git_status"
    ]
]


# ============================================================
# Agent Sidebar
# ============================================================

[ui.sidebar.agents]

row_gap = 0

rows = [
    [
        "state_icon",
        { token = "workspace", fg = "#bd93f9", bold = true },
        "tab"
    ],
    [
        { token = "agent", fg = "#50fa7b", bold = true }
    ]
]

