# jk_os: NetworkManager manages every wired, Wi-Fi and IPv6 interface.
# Configure it with nmcli (as root); connections are saved as files in
# /etc/NetworkManager/system-connections, which an installed system keeps.

[main]
plugins=keyfile
dhcp=internal
# NetworkManager writes /etc/resolv.conf itself.
rc-manager=file
# Only root may change the network; other users can look (nmcli, read only).
auth-polkit=root-only

[device]
wifi.backend=wpa_supplicant
# Random MAC addresses while scanning, the real one when connected.
wifi.scan-rand-mac-address=yes

[logging]
backend=syslog
level=INFO
