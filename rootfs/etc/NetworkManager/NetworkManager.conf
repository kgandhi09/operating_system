# jk_os: NetworkManager manages every wired, Wi-Fi and IPv6 interface.
# Configure it with Plasma's network applet or nmcli; connections are saved
# as files in /etc/NetworkManager/system-connections, which an installed
# system keeps.

[main]
plugins=keyfile
dhcp=internal
# NetworkManager writes /etc/resolv.conf itself.
rc-manager=file
# Who may change the network is polkit's: administrators (group wheel)
# from the desktop or with nmcli (/etc/polkit-1/rules.d), root always.
auth-polkit=true

[device]
wifi.backend=wpa_supplicant
# Random MAC addresses while scanning, the real one when connected.
wifi.scan-rand-mac-address=yes

[logging]
backend=syslog
level=INFO
