# jk_os's settings for foot, the terminal of the dev session (jk-dev).
# Your own: ~/.config/foot/foot.ini (start from a copy of this file); every
# option is described in foot.ini(5) and https://codeberg.org/dnkl/foot.

[main]
# The shell starts as a login shell, so /etc/profile and ~/.profile apply.
login-shell=yes
# xterm-256color: known to the image and to apt's Debian system (Neovim);
# foot still sets COLORTERM=truecolor. With apt's ncurses-term package
# installed, term=foot works too.
term=xterm-256color
font=monospace:size=11
# DejaVu Sans Mono is the image's monospace font; others go in
# ~/.local/share/fonts (e.g. a Nerd Font for Neovim's icons), then:
# font=JetBrainsMono Nerd Font:size=11
pad=4x2

[scrollback]
lines=10000

[cursor]
style=underline
blink=no

[colors-dark]
background=000000

[mouse]
hide-when-typing=yes
