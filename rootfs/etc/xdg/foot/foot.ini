# jk_os's settings for foot, the terminal of the dev session (jk-dev).
# Your own: ~/.config/foot/foot.ini (start from a copy of this file); every
# option is described in foot.ini(5) and https://codeberg.org/dnkl/foot.

[main]
# The shell starts as a login shell, so /etc/profile and ~/.profile apply.
login-shell=yes
# xterm-256color: known to the image and to apt's Debian system (Neovim);
# foot still sets COLORTERM=truecolor. With apt's ncurses-term package
# installed, term=foot works too.
term=xterm-256color
# FiraCode Nerd Font Mono (in the image, with the icons Neovim plugins and
# shell prompts use), 9 points; DejaVu Sans Mono for what it lacks. Other
# fonts go in ~/.local/share/fonts. size= is in points, pixelsize= in pixels.
font=FiraCode Nerd Font Mono:size=9, DejaVu Sans Mono:size=9
pad=4x2

[scrollback]
lines=10000

[cursor]
style=underline
blink=no

# Pure black: the background, and "black" (colour 0), which programs paint
# as their background too (foot's own is dark grey, 242424).
[colors-dark]
alpha=1.0
background=000000
regular0=000000

[mouse]
hide-when-typing=yes
